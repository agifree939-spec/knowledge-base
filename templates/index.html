<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { color: #888; margin-bottom: 2rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .search-box input { flex: 1; padding: 0.75rem 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #4a9eff; }
        .search-box button { padding: 0.75rem 1.5rem; background: #4a9eff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .search-box button:hover { background: #3a8eef; }
        .stats { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
        .stat { background: #1a1a1a; padding: 1rem 1.5rem; border-radius: 8px; flex: 1; text-align: center; }
        .stat .num { font-size: 1.5rem; font-weight: bold; color: #4a9eff; }
        .stat .label { font-size: 0.85rem; color: #888; margin-top: 0.25rem; }
        .results { margin-top: 1rem; }
        .entry { background: #1a1a1a; padding: 1rem 1.5rem; border-radius: 8px; margin-bottom: 0.75rem; cursor: pointer; transition: background 0.2s; }
        .entry:hover { background: #222; }
        .entry .title { font-size: 1.1rem; color: #fff; margin-bottom: 0.25rem; }
        .entry .meta { font-size: 0.8rem; color: #888; }
        .entry .type { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.5rem; }
        .type-tweet { background: #1da1f2; color: #fff; }
        .type-article { background: #6c5ce7; color: #fff; }
        .empty { text-align: center; color: #666; padding: 3rem 0; }
        .capture-box { background: #1a1a1a; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        .capture-box h3 { margin-bottom: 0.75rem; color: #ccc; }
        .capture-input { display: flex; gap: 0.5rem; }
        .capture-input input { flex: 1; padding: 0.6rem 1rem; background: #0f0f0f; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
        .capture-input button { padding: 0.6rem 1.2rem; background: #00b894; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .capture-input button:hover { background: #00a381; }
        .msg { padding: 0.5rem; border-radius: 6px; margin-top: 0.5rem; font-size: 0.85rem; display: none; }
        .msg.ok { display: block; background: #00b89420; color: #00b894; }
        .msg.err { display: block; background: #e74c3c20; color: #e74c3c; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Knowledge Base</h1>
    <p class="subtitle">Personal knowledge base for tweets and articles</p>

    <div class="stats" id="stats">
        <div class="stat"><div class="num" id="s-total">-</div><div class="label">Total</div></div>
        <div class="stat"><div class="num" id="s-tweets">-</div><div class="label">Tweets</div></div>
        <div class="stat"><div class="num" id="s-articles">-</div><div class="label">Articles</div></div>
        <div class="stat"><div class="num" id="s-images">-</div><div class="label">Images</div></div>
    </div>

    <div class="capture-box">
        <h3>➕ Capture URL</h3>
        <div class="capture-input">
            <input id="capture-url" placeholder="Paste tweet or article URL..." />
            <button onclick="doCapture()">Capture</button>
        </div>
        <div class="msg" id="capture-msg"></div>
    </div>

    <div class="search-box">
        <input id="search-q" placeholder="Search knowledge base..." onkeydown="if(event.key==='Enter') doSearch()" />
        <button onclick="doSearch()">Search</button>
    </div>

    <div class="results" id="results"></div>
</div>

<script>
async function loadStats() {
    try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        document.getElementById('s-total').textContent = d.total;
        document.getElementById('s-tweets').textContent = d.tweets;
        document.getElementById('s-articles').textContent = d.articles;
        document.getElementById('s-images').textContent = d.images;
    } catch(e) {}
}

async function loadEntries() {
    try {
        const r = await fetch('/api/entries?limit=50');
        const d = await r.json();
        const el = document.getElementById('results');
        if (d.results.length === 0) {
            el.innerHTML = '<div class="empty">No entries yet. Capture a URL above to get started.</div>';
            return;
        }
        el.innerHTML = d.results.map(e => `
            <div class="entry" onclick="location.href='/detail/${e.id}'">
                <div class="title">${e.title || 'Untitled'}</div>
                <div class="meta">
                    <span class="type type-${e.content_type}">${e.content_type}</span>
                    ${e.author ? e.author + ' · ' : ''}${e.source_url || ''}
                </div>
            </div>
        `).join('');
    } catch(e) {}
}

async function doSearch() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) { loadEntries(); return; }
    try {
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        const d = await r.json();
        const el = document.getElementById('results');
        if (d.results.length === 0) {
            el.innerHTML = '<div class="empty">No results for "' + q + '"</div>';
            return;
        }
        el.innerHTML = d.results.map(e => `
            <div class="entry" onclick="location.href='/detail/${e.id}'">
                <div class="title">${e.title || 'Untitled'}</div>
                <div class="meta">
                    <span class="type type-${e.content_type}">${e.content_type}</span>
                    ${e.author ? e.author + ' · ' : ''}${e.source_url || ''}
                </div>
            </div>
        `).join('');
    } catch(e) {}
}

async function doCapture() {
    const url = document.getElementById('capture-url').value.trim();
    const msg = document.getElementById('capture-msg');
    if (!url) return;
    msg.className = 'msg'; msg.textContent = 'Capturing...'; msg.style.display = 'block';
    try {
        const r = await fetch('/api/capture', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url}) });
        const d = await r.json();
        if (r.ok) {
            msg.className = 'msg ok'; msg.textContent = '✅ Captured: ' + (d.title || url);
            document.getElementById('capture-url').value = '';
            loadStats(); loadEntries();
        } else {
            msg.className = 'msg err'; msg.textContent = '❌ ' + (d.detail || 'Error');
        }
    } catch(e) {
        msg.className = 'msg err'; msg.textContent = '❌ ' + e.message;
    }
}

loadStats();
loadEntries();
</script>
</body>
</html>
