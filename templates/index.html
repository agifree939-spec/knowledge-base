<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识库 — 收录推文与文章</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --card-hover: #1a1a1a;
            --border: #222;
            --text: #e0e0e0;
            --text-dim: #666;
            --accent: #4a9eff;
            --accent-hover: #3a8eef;
            --green: #00b894;
            --green-dim: #00b89420;
            --red: #e74c3c;
            --red-dim: #e74c3c20;
            --twitter: #1da1f2;
            --article: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header h1 span { font-size: 1.3rem; }

        /* Stats bar */
        .stats {
            display: flex;
            gap: 2rem;
        }
        .stat {
            text-align: center;
        }
        .stat .num {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat .label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Capture area */
        .capture {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }
        .capture:focus-within {
            border-color: var(--accent);
        }
        .capture-row {
            display: flex;
            gap: 0.5rem;
        }
        .capture input {
            flex: 1;
            padding: 0.7rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .capture input:focus { border-color: var(--accent); }
        .capture input::placeholder { color: #444; }
        .capture button {
            padding: 0.7rem 1.5rem;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
        }
        .capture button:hover { background: #00a381; }
        .capture button:active { transform: scale(0.97); }
        .capture button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .msg {
            margin-top: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .msg.ok { display: block; background: var(--green-dim); color: var(--green); }
        .msg.err { display: block; background: var(--red-dim); color: var(--red); }

        /* Search */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1;
            padding: 0.65rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar input::placeholder { color: #444; }
        .search-bar button {
            padding: 0.65rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-bar button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Section header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .section-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .clear-search {
            font-size: 0.8rem;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
            display: none;
        }
        .clear-search:hover { text-decoration: underline; }

        /* Entry cards */
        .entries { display: flex; flex-direction: column; gap: 0.5rem; }
        .entry {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .entry:hover {
            background: var(--card-hover);
            border-color: #333;
            transform: translateY(-1px);
        }
        .entry-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .entry-icon.tweet { background: #1da1f220; color: var(--twitter); }
        .entry-icon.article { background: #8b5cf620; color: var(--article); }
        .entry-body { flex: 1; min-width: 0; }
        .entry-title {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 0.35rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .entry-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .entry-meta .tag {
            background: #1a1a2e;
            color: var(--accent);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .entry-date { margin-left: auto; }
        .entry-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }
        .btn-delete {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: #555;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: var(--red-dim);
            color: var(--red);
            border-color: var(--red);
        }
        .entry-summary {
            font-size: 0.82rem;
            color: #555;
            margin-top: 0.35rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 4rem 1rem;
        }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
        .empty-text { color: #444; font-size: 0.95rem; }
        .empty-hint { color: #333; font-size: 0.85rem; margin-top: 0.5rem; }

        /* Loading skeleton */
        .skeleton {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .skeleton-line {
            height: 14px;
            background: #222;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.med { width: 70%; }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .stats { gap: 1.5rem; }
            .capture-row { flex-direction: column; }
            .entry { padding: 0.85rem 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><span>📚</span> 个人知识库 — 收录推文与文章</h1>
        <div class="stats">
            <div class="stat"><div class="num" id="s-total">-</div><div class="label">Total</div></div>
            <div class="stat"><div class="num" id="s-tweets">-</div><div class="label">Tweets</div></div>
            <div class="stat"><div class="num" id="s-articles">-</div><div class="label">Articles</div></div>
            <div class="stat"><div class="num" id="s-images">-</div><div class="label">Images</div></div>
        </div>
    </div>

    <div class="capture">
        <div class="capture-row">
            <input id="capture-url" placeholder="粘贴推文或文章链接..." onkeydown="if(event.key==='Enter') doCapture()" />
            <button id="capture-btn" onclick="doCapture()">📥 收录</button>
        </div>
        <div class="msg" id="capture-msg"></div>
    </div>

    <div class="search-bar">
        <input id="search-q" placeholder="搜索知识库..." onkeydown="if(event.key==='Enter') doSearch()" />
        <button onclick="doSearch()">🔍</button>
    </div>

    <div class="section-header">
        <div class="section-title" id="section-label">最近收录</div>
        <button class="clear-search" id="clear-btn" onclick="clearSearch()">← 返回全部</button>
    </div>

    <div class="entries" id="results">
        <div class="skeleton"><div class="skeleton-line med"></div><div class="skeleton-line short"></div></div>
        <div class="skeleton"><div class="skeleton-line med"></div><div class="skeleton-line short"></div></div>
        <div class="skeleton"><div class="skeleton-line med"></div><div class="skeleton-line short"></div></div>
    </div>
</div>

<script>
const ICONS = { tweet: '🐦', article: '📄' };

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function escapeAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderEntry(e) {
    const icon = ICONS[e.content_type] || '📌';
    const iconClass = e.content_type || 'tweet';
    const title = escapeHtml(e.title || 'Untitled');
    const summary = e.summary ? `<div class="entry-summary">${escapeHtml(e.summary.substring(0, 120))}</div>` : '';
    const author = e.author || e.source_author || '';
    const tags = (e.tags || []).slice(0, 3).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('');
    const date = e.captured_at ? e.captured_at.substring(0, 10) : '';

    return `
        <div class="entry" onclick="location.href='/detail/${e.id}'">
            <div class="entry-icon ${iconClass}">${icon}</div>
            <div class="entry-body">
                <div class="entry-title">${title}</div>
                <div class="entry-meta">
                    ${author ? `<span>${escapeHtml(author)}</span>` : ''}
                    ${tags}
                    ${date ? `<span class="entry-date">${date}</span>` : ''}
                </div>
                ${summary}
            </div>
            <div class="entry-actions">
                <button class="btn-delete" onclick="event.stopPropagation(); deleteEntry(${e.id}, '${escapeAttr(e.title || 'Untitled')}')" title="删除">🗑</button>
            </div>
        </div>`;
}

function renderEmpty(text, hint) {
    return `<div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-text">${text}</div>
        ${hint ? `<div class="empty-hint">${hint}</div>` : ''}
    </div>`;
}

async function loadStats() {
    try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        document.getElementById('s-total').textContent = d.total || 0;
        document.getElementById('s-tweets').textContent = d.tweets || 0;
        document.getElementById('s-articles').textContent = d.articles || 0;
        document.getElementById('s-images').textContent = d.images || 0;
    } catch(e) {}
}

async function loadEntries() {
    try {
        const r = await fetch('/api/entries?limit=50');
        const d = await r.json();
        const el = document.getElementById('results');
        if (!d.results || d.results.length === 0) {
            el.innerHTML = renderEmpty('还没有收录任何内容', '在上方粘贴链接开始收录');
            return;
        }
        el.innerHTML = d.results.map(renderEntry).join('');
    } catch(e) {
        document.getElementById('results').innerHTML = renderEmpty('加载失败', '请刷新页面重试');
    }
}

async function doSearch() {
    const q = document.getElementById('search-q').value.trim();
    if (!q) { clearSearch(); return; }

    document.getElementById('section-label').textContent = '搜索结果';
    document.getElementById('clear-btn').style.display = 'block';

    try {
        const r = await fetch('/api/search?q=' + encodeURIComponent(q));
        const d = await r.json();
        const el = document.getElementById('results');
        if (!d.results || d.results.length === 0) {
            el.innerHTML = renderEmpty(`未找到"${q}"的相关内容`, '试试其他关键词');
            return;
        }
        el.innerHTML = d.results.map(renderEntry).join('');
    } catch(e) {
        document.getElementById('results').innerHTML = renderEmpty('搜索失败', '请重试');
    }
}

function clearSearch() {
    document.getElementById('search-q').value = '';
    document.getElementById('section-label').textContent = '最近收录';
    document.getElementById('clear-btn').style.display = 'none';
    loadEntries();
}

async function deleteEntry(id, title) {
    if (!confirm(`确定删除「${title}」？`)) return;
    try {
        const r = await fetch(`/api/entries/${id}`, { method: 'DELETE' });
        if (r.ok) {
            loadStats();
            loadEntries();
        } else {
            alert('删除失败');
        }
    } catch(e) {
        alert('删除失败: ' + e.message);
    }
}

async function doCapture() {
    const url = document.getElementById('capture-url').value.trim();
    const msg = document.getElementById('capture-msg');
    const btn = document.getElementById('capture-btn');
    if (!url) return;

    btn.disabled = true;
    btn.textContent = '⏳ 收录中...';
    msg.className = 'msg'; msg.textContent = ''; msg.style.display = 'none';

    try {
        const r = await fetch('/api/capture', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({url})
        });
        const d = await r.json();
        if (r.ok) {
            if (d.status === 'exists') {
                msg.className = 'msg ok';
                msg.textContent = `ℹ️ 已存在: ${d.title || url}`;
            } else {
                msg.className = 'msg ok';
                msg.textContent = `✅ 已收录: ${d.title || url}`;
            }
            document.getElementById('capture-url').value = '';
            loadStats();
            loadEntries();
        } else {
            msg.className = 'msg err';
            msg.textContent = `❌ ${d.detail || 'Error'}`;
        }
    } catch(e) {
        msg.className = 'msg err';
        msg.textContent = `❌ ${e.message}`;
    } finally {
        btn.disabled = false;
        btn.textContent = '📥 收录';
    }
}

loadStats();
loadEntries();
</script>
</body>
</html>
